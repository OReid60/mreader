name: Build installable packages
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
  actions: read
jobs:
  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libssl-dev libdbus-1-dev libfuse2
      - run: npm run check
      - name: Prepare verified Android installer for desktop sharing
        run: bash scripts/prepare-mobile-apk.sh
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Prepare frontend assets for native tests
        run: |
          mkdir -p dist
          cp index.html app.js features.js mobile.js style.css dist/
          cp -R vendor dist/
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml
      - run: bash scripts/build-linux.sh
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
      - name: Verify real APK source execution
        run: cargo test --release --locked --manifest-path src-tauri/Cargo.toml live_keiyoushi_kagurabachi -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        with:
          name: mreader-linux
          path: releases/linux/*
          if-no-files-found: error
          retention-days: 14
  verify-packages:
    needs: linux
    uses: ./.github/workflows/verify-linux.yml
    with:
      source_run: ${{ github.run_id }}
