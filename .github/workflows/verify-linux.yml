name: Verify packaged Linux app
on:
  workflow_call:
    inputs:
      source_run:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      source_run:
        description: Packaging workflow run ID
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  packaged-app:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mreader-linux
          path: packages
          run-id: ${{ inputs.source_run }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install headless display and runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0 libwebkit2gtk-4.1-0 libayatana-appindicator3-1 libfuse2 xvfb xauth imagemagick
      - name: Validate packages and extract AppImage
        run: |
          cd packages
          sha256sum --check SHA256SUMS
          dpkg-deb --info ./*.deb > ../linux-deb-info.txt
          chmod +x ./*.AppImage
          ./*.AppImage --appimage-extract > ../linux-extraction.log
      - name: Launch packaged app on a virtual display
        env:
          MREADER_DATA_DIR: ${{ runner.temp }}/mreader-smoke
          WEBKIT_DISABLE_COMPOSITING_MODE: '1'
        run: |
          cat > /tmp/mreader-smoke.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          export APPDIR="$PWD/packages/squashfs-root"
          export MREADER_VERIFY_REPORT="$PWD/linux-verification.json"
          export MREADER_VERIFY_FILES="$(python3 scripts/create-test-fixtures.py)"
          export MREADER_VERIFY_OFFLINE=1
          "$APPDIR/AppRun" > linux-smoke.log 2>&1 &
          reader_pid=$!
          trap 'kill "$reader_pid" 2>/dev/null || true' EXIT
          deadline=$((SECONDS + 90))
          while kill -0 "$reader_pid" 2>/dev/null && ((SECONDS < deadline)); do
            import -window root linux-frame.png
            colors=$(identify -format '%k' linux-frame.png)
            if ((colors > 8)); then cp linux-frame.png linux-smoke.png; fi
            sleep 1
          done
          if kill -0 "$reader_pid" 2>/dev/null; then echo 'Packaged app verification timed out'; exit 1; fi
          wait "$reader_pid"
          test -s linux-smoke.png
          python3 -c 'import json; r=json.load(open("linux-verification.json")); assert r["ok"] and len(r["checks"]) >= 10, r; print("Packaged app checks:", len(r["checks"]))'
          if grep -Ei 'panicked at|error while loading shared libraries|symbol lookup error|cannot open display' linux-smoke.log; then exit 1; fi
          SCRIPT
          xvfb-run -a -s '-screen 0 1920x1080x24' bash /tmp/mreader-smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mreader-linux-validation
          path: |
            linux-smoke.png
            linux-smoke.log
            linux-deb-info.txt
            linux-verification.json
          if-no-files-found: error
          retention-days: 14
